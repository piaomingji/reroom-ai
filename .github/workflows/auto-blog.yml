name: AI Blog Auto Generator

on:
  schedule:
    # 毎日日本時間午前3時 (UTC 18:00) に自動実行
    - cron: '0 18 * * *'
  workflow_dispatch: # 手動実行も可能にする

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # コミットをプッシュするために必須の権限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Generate new blog post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-blog-post.mjs

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/blog.ts public/blog/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: AIによる新規ブログ記事と画像の自動生成" && git push)
